<!doctype html>
<html lang="en" translate="no" class="notranslate">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="minimum-scale=1, initial-scale=1, width=device-width"
    />
    <meta name="theme-color" content="#111114" />
    <meta name="google" content="notranslate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="40x40" href="./appIcon/40.png" />
    <link rel="apple-touch-icon" sizes="58x58" href="./appIcon/58.png" />
    <link rel="apple-touch-icon" sizes="60x60" href="./appIcon/60.png" />
    <link rel="apple-touch-icon" sizes="76x76" href="./appIcon/76.png" />
    <link rel="apple-touch-icon" sizes="80x80" href="./appIcon/80.png" />
    <link rel="apple-touch-icon" sizes="87x87" href="./appIcon/87.png" />
    <link rel="apple-touch-icon" sizes="114x114" href="./appIcon/114.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="./appIcon/120.png" />
    <link rel="apple-touch-icon" sizes="128x128" href="./appIcon/128.png" />
    <link rel="apple-touch-icon" sizes="136x136" href="./appIcon/136.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="./appIcon/152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="./appIcon/167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./appIcon/180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./appIcon/192.png" />
    <link rel="apple-touch-icon" sizes="1024x1024" href="./appIcon/1024.png" />
    <title>HDH CRM</title>
    <meta
      name="description"
      content="HDH CRM: clients, deals and follow-ups in one refined workspace."
    />
    <!-- Deployment settings, rendered by scripts/renderRuntimeConfig.ts -->
    <script vite-ignore src="./config.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
      }

      /* Prevent accidental double-tap zoom on interactive elements */
      button,
      input,
      select,
      textarea,
      a {
        touch-action: manipulation;
      }

      /* HDH splash screen, shown until React mounts */
      .loader-container {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 28px;
        position: absolute;
        inset: 0;
        background-color: #f7f5f0;
      }
      .loader-logo {
        height: 96px;
        width: auto;
        animation: hdh-breathe 2.4s ease-in-out infinite;
      }
      .loader-bar {
        position: relative;
        width: 120px;
        height: 2px;
        overflow: hidden;
        border-radius: 2px;
        background: rgba(198, 161, 91, 0.2);
      }
      .loader-bar::after {
        content: "";
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: 2px;
        background: #c6a15b;
        animation: hdh-slide 1.3s ease-in-out infinite;
      }
      @media (prefers-color-scheme: dark) {
        .loader-container {
          background-color: #0e0e10;
        }
        .loader-logo {
          filter: invert(1);
        }
      }
      @keyframes hdh-breathe {
        0%,
        100% {
          opacity: 0.55;
          transform: scale(0.98);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes hdh-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loader-container">
        <img class="loader-logo" src="./logos/hdh_logo.svg" alt="HDH" />
        <div class="loader-bar" role="progressbar" aria-label="Loading"></div>
      </div>
    </div>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script type="module" src="<%= mainScript %>"></script>
  </body>
</html>
